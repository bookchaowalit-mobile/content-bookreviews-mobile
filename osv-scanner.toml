# Reviewed OSV exceptions for BookEverything (Expo SDK 52). Each entry has a reason and an expiry.
# Reviewed 2026-10-23 when the repo moved to platform-ci-workflows v1.1.1 (ci-node + security).
# Fixed instead of ignored: dropped vitest (all tests run in Jest now), which removed the vitest,
# @vitest/mocker, vite and tinypool advisories; a lockfile-only `npm update` cleared compression,
# shell-quote and source-map-js. Everything below except decode-uri-component is Expo SDK 52 CLI /
# build tooling that is not shipped in the app bundle. All of it needs the Expo SDK 53+ upgrade
# (docs/UPGRADE-PLAN.md P2). Re-check on that upgrade or at expiry.

# @xmldom/xmldom 0.7.13 via @expo/cli -> @expo/plist 0.2.2 (Expo SDK 52 CLI). Parses this repo's own
# Info.plist / config during `expo prebuild` / `expo run:ios`; not in the app bundle, and CI never runs
# prebuild. Fixed only in 0.8.x, which @expo/plist 0.2 does not accept; SDK 53 moves to @expo/plist 0.3.
[[IgnoredVulns]]
