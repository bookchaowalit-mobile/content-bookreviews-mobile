name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail-closed: npm ci, lint (expo lint), typecheck (tsc --noEmit, strict),
  # Jest (jest-expo preset) with a line-coverage gate, then an Android JS
  # bundle export (catches unresolved imports). No EAS / Expo cloud build
  # here: that needs an owner-linked Expo account and is an owner action.
  app:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true
      coverage-threshold: "58"
      build-command: npx expo export --platform android --output-dir dist

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@493a7f5c322219e61245cf17f1fa34de2c35a22b # v1.6.6
